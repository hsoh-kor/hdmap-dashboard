<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주요 오류사례 가이드 관리</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6;
        }

        header {
            background-color: var(--primary-color); color: white;
            padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 20px; }

        .back-link { text-decoration: none; color: white; font-size: 0.9rem; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 4px; }
        .back-link:hover { background: rgba(255,255,255,0.2); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { padding: 8px 16px; background: var(--accent-color); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* 입력 폼 스타일 */
        .input-form { display: none; background: white; border-radius: 8px; border: 2px dashed var(--accent-color); padding: 25px; margin-bottom: 30px; }
        .input-form input, .input-form textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem; box-sizing: border-box; }
        .input-form textarea { height: 80px; resize: none; }
        
        .drop-zone { border: 2px dashed #bbb; border-radius: 6px; padding: 20px; text-align: center; color: #777; cursor: pointer; margin-bottom: 15px; background: #fafafa; font-size: 0.85rem; }
        .drop-zone.dragover { border-color: var(--accent-color); background: #fff8f1; }
        .drop-zone.has-file { border-color: var(--accent-color); color: var(--accent-color); font-weight: bold; }

        /* 오류 사례 템플릿 스타일 */
        section.error-case { background: white; border-radius: 8px; border: 1px solid var(--border-color); padding: 2rem; margin-bottom: 2.5rem; position: relative; }
        .category-tag { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; background: #eee; margin-bottom: 10px; color: #666; }
        h2 { margin: 0 0 15px 0; font-size: 1.4rem; color: var(--primary-color); }
        
        .btn-del { position: absolute; top: 20px; right: 20px; color: #e74c3c; border: none; background: none; cursor: pointer; font-weight: bold; font-size: 0.85rem; }

        .error-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .error-table th, .error-table td { border: 1px solid var(--border-color); padding: 12px; text-align: left; font-size: 0.95rem; }
        .error-table th { background-color: #f9f9f9; color: #555; width: 20%; }
        
        .case-box { background: #fff5f0; border: 1px solid #ffccbc; border-radius: 6px; padding: 20px; margin-top: 20px; }
        .case-box b { color: #d84315; display: block; margin-bottom: 8px; }
        
        /* 이미지 및 파일 버튼 스타일 */
        .case-image { max-width: 100%; height: auto; border-radius: 4px; margin-top: 15px; border: 1px solid #ddd; display: block; }
        .btn-download { display: inline-flex; align-items: center; gap: 5px; padding: 10px 15px; background: var(--primary-color); color: white; text-decoration: none; border-radius: 6px; font-size: 0.9rem; font-weight: bold; margin-top: 15px; transition: background 0.2s; }
        .btn-download:hover { background: #1a252f; }
        
        /* 외부 링크 버튼 특별 스타일 */
        .btn-link { background: #27ae60; }
        .btn-link:hover { background: #219150; }

        .pdf-viewer { width: 100%; height: 500px; border: 1px solid #ddd; border-radius: 6px; margin-top: 15px; display: block; }

        .form-actions { text-align: right; margin-top: 10px; }
        .btn-cancel { padding: 8px 16px; background: #eee; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px; }

        footer { text-align: center; padding: 3rem; color: #999; font-size: 0.85rem; }


        /* ==========================================
           🌙 다크모드 스타일
           - 오류사례 가이드 전용
           - LocalStorage 키는 다른 페이지와 동일하게 hdmap_theme 사용
        ========================================== */
        .theme-toggle-btn {
            background: rgba(255,255,255,0.12);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 4px;
            padding: 5px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .theme-toggle-btn:hover { background: rgba(255,255,255,0.22); }

        body.dark-mode {
            --primary-color: #111827;
            --accent-color: #fb923c;
            --bg-color: #0f172a;
            --text-color: #e5e7eb;
            --border-color: #334155;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        body.dark-mode header { background-color: #020617; box-shadow: 0 2px 8px rgba(0,0,0,0.45); }
        body.dark-mode section.error-case,
        body.dark-mode .input-form { background: #111827; border-color: #334155; color: #e5e7eb; }
        body.dark-mode h2 { color: #e5e7eb; }
        body.dark-mode .section-header p,
        body.dark-mode footer,
        body.dark-mode .case-box,
        body.dark-mode .error-table td { color: #cbd5e1 !important; }
        body.dark-mode .input-form input,
        body.dark-mode .input-form textarea,
        body.dark-mode #caseExternalLink {
            background-color: #020617;
            color: #e5e7eb;
            border-color: #475569;
        }
        body.dark-mode .input-form input::placeholder,
        body.dark-mode .input-form textarea::placeholder { color: #94a3b8; }
        body.dark-mode .drop-zone { background: #020617; border-color: #475569; color: #cbd5e1; }
        body.dark-mode .drop-zone.dragover,
        body.dark-mode .drop-zone.has-file { background: #1e293b; border-color: #fb923c; color: #fdba74; }
        body.dark-mode .category-tag { background: #334155; color: #cbd5e1; }
        body.dark-mode .error-table th { background-color: #1e293b; color: #e5e7eb; }
        body.dark-mode .error-table th,
        body.dark-mode .error-table td { border-color: #334155; }
        body.dark-mode .case-box { background: #1f2937; border-color: #7c2d12; }
        body.dark-mode .case-box b { color: #fdba74; }
        body.dark-mode .btn-cancel { background: #334155; color: #e5e7eb; }
        body.dark-mode .pdf-viewer,
        body.dark-mode .case-image { border-color: #475569; }
        body.dark-mode .back-link { background: rgba(255,255,255,0.12); }
        body.dark-mode .back-link:hover { background: rgba(255,255,255,0.22); }



        /* ==========================================
           🌙 다크모드 보강 패치 v2
           - 오류사례 페이지 인라인 색상/첨부영역/표 글씨 보정
        ========================================== */
        body.dark-mode h1,
        body.dark-mode h2,
        body.dark-mode h3,
        body.dark-mode h4,
        body.dark-mode .container,
        body.dark-mode .container *:not(button):not(a),
        body.dark-mode .error-table,
        body.dark-mode .error-table *,
        body.dark-mode .case-box,
        body.dark-mode .case-box *,
        body.dark-mode [style*="color:#333"],
        body.dark-mode [style*="color: #333"],
        body.dark-mode [style*="color:#555"],
        body.dark-mode [style*="color: #555"],
        body.dark-mode [style*="color:#666"],
        body.dark-mode [style*="color: #666"],
        body.dark-mode [style*="color:#777"],
        body.dark-mode [style*="color: #777"],
        body.dark-mode [style*="color:#888"],
        body.dark-mode [style*="color: #888"],
        body.dark-mode [style*="color:#999"],
        body.dark-mode [style*="color: #999"] {
            color: #dbeafe !important;
        }
        body.dark-mode [style*="background: #f0f7ff"],
        body.dark-mode [style*="background:#f0f7ff"],
        body.dark-mode [style*="background: #fafafa"],
        body.dark-mode [style*="background:#fafafa"],
        body.dark-mode [style*="background: #f9f9f9"],
        body.dark-mode [style*="background:#f9f9f9"],
        body.dark-mode [style*="background: white"],
        body.dark-mode [style*="background:white"] {
            background: #1e293b !important;
            background-color: #1e293b !important;
            border-color: #475569 !important;
            color: #e5e7eb !important;
        }
        body.dark-mode input,
        body.dark-mode textarea {
            background-color: #020617 !important;
            color: #f8fafc !important;
            border-color: #475569 !important;
        }
        body.dark-mode input::placeholder,
        body.dark-mode textarea::placeholder { color: #94a3b8 !important; }
        body.dark-mode .btn-add,
        body.dark-mode .btn-download,
        body.dark-mode .btn-link,
        body.dark-mode .theme-toggle-btn { color: #ffffff !important; }
        body.dark-mode .btn-del { color: #fca5a5 !important; }
        body.dark-mode .btn-cancel { background: #334155 !important; color: #e5e7eb !important; }
        body.dark-mode .back-link { color: #ffffff !important; }

    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:15px;">
        <img src="logo_Type8.png" alt="Logo" style="height:32px;">
        <h1 style="margin:0; font-size:1.3rem;">주요 오류사례 및 조치 가이드</h1>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
        <a href="index.html" class="back-link">🏠 메인 포털로 돌아가기</a>
    </div>
</header>

<div class="container">
    <div class="section-header">
        <p style="color:#666; margin:0;">검수 과정에서 발생한 실제 부적합 사례를 등록하고 관리하세요.</p>
        <button class="btn-add" onclick="toggleForm()">+ 새 사례 등록</button>
    </div>

    <div id="errorForm" class="input-form">
        <h3 style="margin-top:0; color:var(--accent-color);">오류 사례 입력</h3>
        <input type="text" id="caseCategory" placeholder="카테고리 (예: 기하 구조, 속성 정보)">
        <input type="text" id="caseTitle" placeholder="오류 명칭 (제목)">
        <textarea id="caseCause" placeholder="발생 원인"></textarea>
        <textarea id="caseDesc" placeholder="오류 내용"></textarea>
        <textarea id="caseMethod" placeholder="조치 방법"></textarea>
        <textarea id="caseExample" placeholder="상세 사례 설명"></textarea>
        
        <div style="background: #f0f7ff; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #cce5ff;">
            <b style="color: #0056b3; font-size: 0.9rem; display: block; margin-bottom: 10px;">💾 첨부 파일 설정 (둘 중 하나만 선택)</b>
            
            <input type="text" id="caseExternalLink" placeholder="🔗 옵션 1. 대용량 파일 공유 링크 (구글 드라이브 등 URL 입력)" style="border-color: #99c2ff;">
            
            <div style="text-align: center; color: #666; font-size: 0.8rem; margin: 10px 0;">또는</div>
            
            <div id="dropZone" class="drop-zone" style="margin-bottom: 0;">
                <span id="dropZoneText">📸 옵션 2. 소용량 파일(JPG, PDF 등 5MB 이하) 드래그 업로드</span>
                <input type="file" id="caseFile" style="display:none;" accept="image/*, .pdf, application/pdf, .pptx, application/vnd.openxmlformats-officedocument.presentationml.presentation">
            </div>
        </div>

        <div class="form-actions">
            <button class="btn-cancel" onclick="toggleForm()">취소</button>
            <button class="btn-add" onclick="saveCase()">사례 등록하기</button>
        </div>
    </div>

    <div id="caseList"></div>
</div>

<footer>
    &copy; 2026 정밀도로지도 프로젝트 관리 지원 센터
</footer>

<script>
    let errorCases = JSON.parse(localStorage.getItem('errorCases')) || [];

    function toggleForm() {
        const form = document.getElementById('errorForm');
        form.style.display = (form.style.display === 'block') ? 'none' : 'block';
    }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('caseFile');
    const dropZoneText = document.getElementById('dropZoneText');
    const externalLinkInput = document.getElementById('caseExternalLink'); // 링크 입력칸
    
    let uploadedFileData = "";
    let uploadedFileName = "";
    let uploadedFileType = "";

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFile(e.target.files[0]);
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('dragover');
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFile(e.dataTransfer.files[0]);
    };

    function handleFile(file) {
        if (!file) return;
        
        const isImage = file.type.startsWith('image/');
        const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        const isPPTX = file.name.toLowerCase().endsWith('.pptx') || file.type.includes('presentation');

        if (!isImage && !isPDF && !isPPTX) {
            return alert("이미지, PDF, 또는 PPTX 파일만 업로드 가능합니다.");
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            uploadedFileData = e.target.result;
            uploadedFileName = file.name;
            
            if (isImage) uploadedFileType = 'image';
            else if (isPDF) uploadedFileType = 'pdf';
            else if (isPPTX) uploadedFileType = 'pptx';
            
            dropZoneText.innerHTML = `✅ 파일 선택 완료: <b>${file.name}</b>`;
            dropZone.classList.add('has-file');
            
            // 파일 업로드 시 링크 칸은 비워줍니다.
            externalLinkInput.value = "";
        };
        reader.readAsDataURL(file);
    }

    // 링크 칸에 글을 쓰면 드롭존을 초기화합니다.
    externalLinkInput.addEventListener('input', () => {
        if (externalLinkInput.value.trim() !== "") {
            uploadedFileData = "";
            uploadedFileName = "";
            uploadedFileType = "";
            fileInput.value = "";
            dropZoneText.innerHTML = "📸 옵션 2. 소용량 파일(JPG, PDF 등 5MB 이하) 드래그 업로드";
            dropZone.classList.remove('has-file');
        }
    });

    function saveCase() {
        const category = document.getElementById('caseCategory').value;
        const title = document.getElementById('caseTitle').value;
        const cause = document.getElementById('caseCause').value;
        const desc = document.getElementById('caseDesc').value;
        const method = document.getElementById('caseMethod').value;
        const example = document.getElementById('caseExample').value;
        const externalLink = document.getElementById('caseExternalLink').value;

        if (!title || !category) return alert("카테고리와 제목은 필수입니다.");

        const newCase = {
            id: Date.now(),
            category, title, cause, desc, method, example,
            fileData: uploadedFileData,
            fileName: uploadedFileName,
            fileType: uploadedFileType,
            externalLink: externalLink // 🌟 링크 데이터 추가 저장
        };

        try {
            errorCases.unshift(newCase);
            localStorage.setItem('errorCases', JSON.stringify(errorCases));
        } catch (e) {
            alert("🚨 브라우저 저장소 용량이 초과되었습니다! 용량이 큰 파일은 [옵션 1] 구글 드라이브 링크를 이용해주세요.");
            errorCases.shift(); 
            return;
        }
        
        // 폼 초기화
        document.querySelectorAll('.input-form input, .input-form textarea').forEach(el => el.value = "");
        uploadedFileData = "";
        uploadedFileName = "";
        uploadedFileType = "";
        fileInput.value = "";
        dropZoneText.innerHTML = "📸 옵션 2. 소용량 파일(JPG, PDF 등 5MB 이하) 드래그 업로드";
        dropZone.classList.remove('has-file');
        
        toggleForm();
        renderCases();
    }

    function deleteCase(id) {
        const adminPassword = "1234"; 
        const inputPwd = prompt("삭제를 위해 관리자 비밀번호를 입력하세요:");
        if (inputPwd === null) return;
        if (inputPwd !== adminPassword) return alert("비밀번호가 틀렸습니다.");

        if (!confirm("이 사례를 정말 삭제하시겠습니까?")) return;
        errorCases = errorCases.filter(c => c.id !== id);
        localStorage.setItem('errorCases', JSON.stringify(errorCases));
        renderCases();
    }

    function renderCases() {
        const list = document.getElementById('caseList');
        if (errorCases.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#999; padding:50px;">등록된 오류 사례가 없습니다. 새로운 사례를 등록해 주세요.</p>';
            return;
        }

        list.innerHTML = errorCases.map(c => {
            let fileHtml = '';
            
            // 🌟 1. 우선순위: 외부 링크가 있으면 무조건 링크 버튼 생성
            if (c.externalLink && c.externalLink.trim() !== "") {
                fileHtml = `<a href="${c.externalLink}" target="_blank" class="btn-download btn-link">🔗 대용량 원본 파일 열기 (구글 드라이브 등)</a>`;
            } 
            // 🌟 2. 외부 링크가 없고 파일만 업로드된 경우 기존 로직
            else if (c.fileData) {
                if (c.fileType === 'image') {
                    fileHtml = `<img src="${c.fileData}" class="case-image">`;
                } else if (c.fileType === 'pdf') {
                    fileHtml = `<iframe src="${c.fileData}#toolbar=0" class="pdf-viewer"></iframe>`;
                } else if (c.fileType === 'pptx') {
                    fileHtml = `<p style="font-size:0.8rem; color:#666;">(PPTX 파일은 브라우저 미리보기를 지원하지 않습니다)</p>
                                <a href="${c.fileData}" download="${c.fileName}" class="btn-download">📄 ${c.fileName} 다운로드</a>`;
                }
            }

            return `
                <section class="error-case">
                    <button class="btn-del" onclick="deleteCase(${c.id})">삭제</button>
                    <div class="category-tag">${c.category}</div>
                    <h2>${c.title}</h2>
                    <table class="error-table">
                        <tr><th>발생 원인</th><td>${c.cause || '-'}</td></tr>
                        <tr><th>오류 내용</th><td>${c.desc || '-'}</td></tr>
                        <tr><th>조치 방법</th><td>${c.method || '-'}</td></tr>
                    </table>
                    <div class="case-box">
                        <div style="margin-bottom: 10px;">
                            <b>📍 상세 사례 및 현황</b>
                            ${c.example || ''}
                        </div>
                        ${fileHtml}
                    </div>
                </section>
            `;
        }).join('');
    }

    renderCases();

    // ==========================================
    // 🌙 저장된 테마 적용 로직
    // - 전환 버튼은 index.html에만 두고,
    // - 이 페이지는 LocalStorage에 저장된 테마만 따라갑니다.
    // ==========================================
    (function applySavedThemeMode() {
        const savedTheme = localStorage.getItem('hdmap_theme') || 'light';
        document.body.classList.toggle('dark-mode', savedTheme === 'dark');
    })();
</script>

</body>
</html>
