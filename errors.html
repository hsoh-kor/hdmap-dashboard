<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주요 오류사례 가이드 관리</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6;
        }

        header {
            background-color: var(--primary-color); color: white;
            padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 20px; }

        .back-link { text-decoration: none; color: white; font-size: 0.9rem; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 4px; }
        .back-link:hover { background: rgba(255,255,255,0.2); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { padding: 8px 16px; background: var(--accent-color); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* 입력 폼 스타일 */
        .input-form { display: none; background: white; border-radius: 8px; border: 2px dashed var(--accent-color); padding: 25px; margin-bottom: 30px; }
        .input-form input, .input-form textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem; box-sizing: border-box; }
        .input-form textarea { height: 80px; resize: none; }
        
        .drop-zone { border: 2px dashed #bbb; border-radius: 6px; padding: 20px; text-align: center; color: #777; cursor: pointer; margin-bottom: 15px; background: #fafafa; font-size: 0.85rem; }
        .drop-zone.dragover { border-color: var(--accent-color); background: #fff8f1; }
        .drop-zone.has-file { border-color: var(--accent-color); color: var(--accent-color); font-weight: bold; }

        /* 오류 사례 템플릿 스타일 */
        section.error-case { background: white; border-radius: 8px; border: 1px solid var(--border-color); padding: 2rem; margin-bottom: 2.5rem; position: relative; }
        .category-tag { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; background: #eee; margin-bottom: 10px; color: #666; }
        h2 { margin: 0 0 15px 0; font-size: 1.4rem; color: var(--primary-color); }
        
        .btn-del { position: absolute; top: 20px; right: 20px; color: #e74c3c; border: none; background: none; cursor: pointer; font-weight: bold; font-size: 0.85rem; }

        .error-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .error-table th, .error-table td { border: 1px solid var(--border-color); padding: 12px; text-align: left; font-size: 0.95rem; }
        .error-table th { background-color: #f9f9f9; color: #555; width: 20%; }
        
        .case-box { background: #fff5f0; border: 1px solid #ffccbc; border-radius: 6px; padding: 20px; margin-top: 20px; }
        .case-box b { color: #d84315; display: block; margin-bottom: 8px; }
        
        /* 이미지 스타일 */
        .case-image { max-width: 100%; height: auto; border-radius: 4px; margin-top: 15px; border: 1px solid #ddd; display: block; }

        .form-actions { text-align: right; margin-top: 10px; }
        .btn-cancel { padding: 8px 16px; background: #eee; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px; }

        footer { text-align: center; padding: 3rem; color: #999; font-size: 0.85rem; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:15px;">
        <img src="logo_Type8.png" alt="Logo" style="height:32px;">
        <h1 style="margin:0; font-size:1.3rem;">주요 오류사례 및 조치 가이드</h1>
    </div>
    <a href="index.html" class="back-link">🏠 메인 포털로 돌아가기</a>
</header>

<div class="container">
    <div class="section-header">
        <p style="color:#666; margin:0;">검수 과정에서 발생한 실제 부적합 사례를 등록하고 관리하세요.</p>
        <button class="btn-add" onclick="toggleForm()">+ 새 사례 등록</button>
    </div>

    <div id="errorForm" class="input-form">
        <h3 style="margin-top:0; color:var(--accent-color);">오류 사례 입력</h3>
        <input type="text" id="caseCategory" placeholder="카테고리 (예: 기하 구조, 속성 정보)">
        <input type="text" id="caseTitle" placeholder="오류 명칭 (제목)">
        <textarea id="caseCause" placeholder="발생 원인"></textarea>
        <textarea id="caseDesc" placeholder="오류 내용"></textarea>
        <textarea id="caseMethod" placeholder="조치 방법"></textarea>
        <textarea id="caseExample" placeholder="상세 사례 설명"></textarea>
        
        <div id="dropZone" class="drop-zone">
            <span id="dropZoneText">📸 참고 이미지를 드래그하거나 클릭하여 업로드하세요</span>
            <input type="file" id="caseFile" style="display:none;" accept="image/*">
        </div>

        <div class="form-actions">
            <button class="btn-cancel" onclick="toggleForm()">취소</button>
            <button class="btn-add" onclick="saveCase()">사례 등록하기</button>
        </div>
    </div>

    <div id="caseList"></div>
</div>

<footer>
    &copy; 2026 정밀도로지도 프로젝트 관리 지원 센터
</footer>

<script>
    // 데이터 로드
    let errorCases = JSON.parse(localStorage.getItem('errorCases')) || [];

    function toggleForm() {
        const form = document.getElementById('errorForm');
        form.style.display = (form.style.display === 'block') ? 'none' : 'block';
    }

    // 드래그 앤 드롭 로직
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('caseFile');
    const dropZoneText = document.getElementById('dropZoneText');
    let uploadedImageData = "";

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFile(e.target.files[0]);
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('dragover');
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFile(e.dataTransfer.files[0]);
    };

    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) return alert("이미지 파일만 업로드 가능합니다.");
        const reader = new FileReader();
        reader.onload = (e) => {
            uploadedImageData = e.target.result;
            dropZoneText.innerHTML = `✅ 이미지 선택 완료: <b>${file.name}</b>`;
            dropZone.classList.add('has-file');
        };
        reader.readAsDataURL(file);
    }

    function saveCase() {
        const category = document.getElementById('caseCategory').value;
        const title = document.getElementById('caseTitle').value;
        const cause = document.getElementById('caseCause').value;
        const desc = document.getElementById('caseDesc').value;
        const method = document.getElementById('caseMethod').value;
        const example = document.getElementById('caseExample').value;

        if (!title || !category) return alert("카테고리와 제목은 필수입니다.");

        const newCase = {
            id: Date.now(),
            category, title, cause, desc, method, example,
            image: uploadedImageData
        };

        errorCases.unshift(newCase);
        localStorage.setItem('errorCases', JSON.stringify(errorCases));
        
        // 초기화
        document.querySelectorAll('.input-form input, .input-form textarea').forEach(el => el.value = "");
        uploadedImageData = "";
        dropZoneText.innerHTML = "📸 참고 이미지를 드래그하거나 클릭하여 업로드하세요";
        dropZone.classList.remove('has-file');
        
        toggleForm();
        renderCases();
    }

    function deleteCase(id) {
        const adminPassword = "1234"; // 비밀번호 설정
        const inputPwd = prompt("삭제를 위해 관리자 비밀번호를 입력하세요:");
        if (inputPwd !== adminPassword) return alert("비밀번호가 틀렸습니다.");

        if (!confirm("이 사례를 정말 삭제하시겠습니까?")) return;
        errorCases = errorCases.filter(c => c.id !== id);
        localStorage.setItem('errorCases', JSON.stringify(errorCases));
        renderCases();
    }

    function renderCases() {
        const list = document.getElementById('caseList');
        if (errorCases.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#999; padding:50px;">등록된 오류 사례가 없습니다. 새로운 사례를 등록해 주세요.</p>';
            return;
        }

        list.innerHTML = errorCases.map(c => `
            <section class="error-case">
                <button class="btn-del" onclick="deleteCase(${c.id})">삭제</button>
                <div class="category-tag">${c.category}</div>
                <h2>${c.title}</h2>
                <table class="error-table">
                    <tr><th>발생 원인</th><td>${c.cause || '-'}</td></tr>
                    <tr><th>오류 내용</th><td>${c.desc || '-'}</td></tr>
                    <tr><th>조치 방법</th><td>${c.method || '-'}</td></tr>
                </table>
                <div class="case-box">
                    <b>📍 상세 사례 및 현황</b>
                    ${c.example || '상세 내용 없음'}
                    ${c.image ? `<img src="${c.image}" class="case-image">` : ''}
                </div>
            </section>
        `).join('');
    }

    renderCases();
</script>

</body>
</html>
